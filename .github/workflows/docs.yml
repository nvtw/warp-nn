name: docs

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
    # setup
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        path: checkout-main
    - name: Checkout develop
      uses: actions/checkout@v4
      with:
        ref: develop
        path: checkout-develop
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    # build docs (main)
    - name: Install dependencies (main)
      working-directory: checkout-main
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet -e .[docs]
        python -m pip list
    - name: Build docs (main)
      working-directory: checkout-main
      run: sphinx-build -b html docs/ ../site/latest/
      env:
        GITHUB_REF_NAME: main
    # build docs (develop)
    - name: Install dependencies (develop)
      working-directory: checkout-develop
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet -e .[docs]
        python -m pip list
    - name: Build docs (develop)
      working-directory: checkout-develop
      run: sphinx-build -b html docs/ ../site/develop/
      env:
        GITHUB_REF_NAME: develop
    # create root redirect and place switcher.json at a stable root URL
    - name: Build root
      run: |
        cp checkout-develop/docs/_static/switcher.json site/switcher.json
        cp checkout-develop/docs/_static/index.html site/index.html
    # setup pages and upload artifact
    - name: Setup Pages
      uses: actions/configure-pages@v5
      id: pages
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

  deploy:
    name: Deploy docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      id: deployment
